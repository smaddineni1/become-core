<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Become</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <style>body{font-family:system-ui,-apple-system,sans-serif}</style>
</head>
<body class="bg-slate-950 text-white antialiased min-h-screen flex items-center justify-center px-6">
<div class="w-full max-w-md">
  <div class="text-center mb-10">
    <a href="/" class="text-4xl font-bold text-indigo-400">Become</a>
    <p class="text-slate-400 mt-2">Start your wellness journey</p>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
    <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>
    <div class="space-y-4">
      <div>
        <label class="text-slate-400 text-sm block mb-1">Full Name</label>
        <input type="text" placeholder="John Doe" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder:text-slate-500 focus:border-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="text-slate-400 text-sm block mb-1">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder:text-slate-500 focus:border-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="text-slate-400 text-sm block mb-1">Password</label>
        <input type="password" placeholder="Min 8 characters" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder:text-slate-500 focus:border-indigo-500 focus:outline-none">
      </div>
      <a href="/scan.html" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-center rounded-xl py-3 font-semibold text-lg transition-colors mt-2">Create Account</a>
    </div>
    <div class="mt-6 space-y-3">
      <div class="flex items-center gap-3 my-4"><div class="flex-1 h-px bg-slate-700"></div><span class="text-slate-500 text-xs">OR</span><div class="flex-1 h-px bg-slate-700"></div></div>
      <button class="w-full bg-white text-slate-900 rounded-xl py-3 font-semibold hover:bg-gray-100"> Continue with Apple</button>
      <button class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl py-3 font-semibold hover:bg-slate-700"> Continue with Google</button>
    </div>
    <p class="text-slate-500 text-xs text-center mt-6 leading-5">By creating an account, you agree to our Terms of Service and Privacy Policy.</p>
    <div class="text-center mt-4"><a href="/signin.html" class="text-indigo-400 hover:text-indigo-300 text-sm font-medium">Already have an account? Sign In</a></div>
  </div>
</div>
</body>
</html>
